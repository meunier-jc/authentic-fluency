name: Weekly contribution metrics

on:
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: weekly-contribution-metrics
  cancel-in-progress: false

jobs:
  collect:
    name: Collect contribution metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and summarize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          METRICS_DAYS: '7'
          METRICS_OUT_DIR: metrics
        run: python .github/scripts/collect_metrics.py

      - name: Upload raw aggregate data
        uses: actions/upload-artifact@v4
        with:
          name: weekly-contribution-metrics-${{ github.run_id }}
          path: metrics/*.json
          retention-days: 180

      - name: Commit latest Markdown report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/latest.md
          git diff --cached --quiet || git commit -m 'chore(metrics): update weekly contribution report'
          git push
